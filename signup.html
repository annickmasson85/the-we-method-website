<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Your Private Account | The We Method</title>
  <link rel="stylesheet" href="signup.css">
  <style>
    .password-field { position: relative; }
    .password-field input { padding-right: 72px; }
    .password-toggle {
      position: absolute;
      top: 50%;
      right: 8px;
      z-index: 10;
      transform: translateY(-50%);
      pointer-events: auto;
    }
  </style>
</head>
<body class="signup-page">
  <main class="signup-main">
    <section class="signup-card">
      <header class="signup-heading">
        <h1>CREATE YOUR PRIVATE ACCOUNT</h1>
        <p>Your secure access to The We Method begins here.</p>
      </header>

      <form class="signup-form" id="signup-form">
        <div class="form-field form-field-full">
          <label for="company">COMPANY NAME <span>(Optional)</span></label>
          <input type="text" id="company" name="company">
        </div>

        <div class="form-field">
          <label for="first-name">FIRST NAME</label>
          <input type="text" id="first-name" name="firstName" required>
        </div>

        <div class="form-field">
          <label for="last-name">LAST NAME</label>
          <input type="text" id="last-name" name="lastName" required>
        </div>

        <div class="form-field">
          <label for="birth-date">DATE OF BIRTH</label>
          <input type="date" id="birth-date" name="birthDate" required>
        </div>

        <div class="form-field">
          <label for="email">E-MAIL</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-field">
          <label for="password">PASSWORD</label>
          <div class="password-field">
            <input type="password" id="password" name="password" minlength="8" required>
            <button type="button" class="password-toggle">SHOW</button>
          </div>
        </div>

        <div class="form-field">
          <label for="confirm-password">CONFIRM YOUR PASSWORD</label>
          <div class="password-field">
            <input type="password" id="confirm-password" name="confirmPassword" minlength="8" required>
            <button type="button" class="password-toggle">SHOW</button>
          </div>
        </div>

        <div class="form-field">
          <label for="city">CITY</label>
          <input type="text" id="city" name="city" required>
        </div>

        <div class="form-field">
          <label for="state">STATE</label>
          <input type="text" id="state" name="state" required>
        </div>

        <p class="security-message form-field-full">Your information is protected through private, secure access.</p>
        <p id="signup-message" class="signup-message form-field-full"></p>

        <div class="form-field-full signup-submit">
          <button type="submit" class="create-account-button">CREATE MY ACCOUNT</button>
        </div>
      </form>

      <div class="signup-bottom">
        <a class="back-button" href="index.html">← BACK</a>
        <p>Already have an account? <a href="signin.html">SIGN IN</a></p>
      </div>
    </section>
  </main>

  <footer class="site-footer impl-footer">
    <div class="impl-footer-inner">
      <div class="impl-footer-left">
        <strong>TWM</strong>
        <span>TESTED. PROVEN. BUILT TO LAST.</span>
      </div>
      <div class="impl-footer-social">
        <a href="https://www.instagram.com/thewemethod/" target="_blank" rel="noopener noreferrer">Instagram</a>
        <span>·</span>
        <a href="https://www.facebook.com/profile.php?id=61593652130304" target="_blank" rel="noopener noreferrer">Facebook</a>
      </div>
      <div class="impl-footer-right">
        <a href="mailto:info@thewemethod.com">info@thewemethod.com</a>
        <span>© 2026 The We Method</span>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="signup.js"></script>
</body>
</html>
