<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TWM | Application Desk</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="twm-application-desk.css">
</head>
<body>
<main class="shell">
  <header class="header">
    <div>
      <div class="eyebrow">TWM · PRIVATE MANAGEMENT</div>
      <h1 class="heading">Application Desk</h1>
      <div class="sub">Review. Evaluate. Decide.</div>
    </div>
    <div class="brand">TWM<small>EST. 2025</small></div>
  </header>

  <div class="stats">
    <div class="stat"><strong id="pending-count">0</strong><span>Pending</span></div>
    <div class="stat"><strong id="accepted-count">0</strong><span>Accepted</span></div>
    <div class="stat"><strong id="declined-count">0</strong><span>Declined</span></div>
  </div>

  <div class="workspace">
    <aside class="panel">
      <h2 class="panel-title">Incoming applications <span class="badge" id="queue-count">0 to review</span></h2>
      <input type="search" id="search" placeholder="Search applications..." aria-label="Search applications">
      <nav class="controls" aria-label="Filter applications">
        <button class="filter active" data-filter="pending">Pending</button>
        <button class="filter" data-filter="accepted">Accepted</button>
        <button class="filter" data-filter="declined">Declined</button>
        <button class="filter" data-filter="all">All</button>
      </nav>
      <div class="application-list" id="application-list"></div>
    </aside>
    <section class="detail" id="detail" aria-live="polite"></section>
  </div>

  <footer class="footer">THE WE METHOD™ · PRIVATE OPERATIONS</footer>
</main>
<script src="twm-application-desk.js"></script>
</body>
</html>
