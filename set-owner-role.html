<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set Owner Role | The We Method</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #f3ead8;
      --muted: rgba(243, 234, 216, 0.62);
      --line: rgba(201, 169, 98, 0.35);
      --gold: #c9a962;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b0b0b;
      color: var(--ink);
      font-family: Montserrat, sans-serif;
      padding: 32px 16px;
    }
    .card {
      width: min(520px, 100%);
      border: 1px solid var(--line);
      padding: 42px 36px;
      text-align: center;
    }
    p.kicker {
      margin: 0 0 10px;
      color: var(--gold);
      letter-spacing: 0.28em;
      font-size: 10px;
    }
    h1 {
      margin: 0 0 14px;
      font-family: "Cormorant Garamond", serif;
      font-size: 42px;
      font-weight: 500;
    }
    p.copy {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }
    button {
      width: 100%;
      height: 48px;
      border: 0;
      background: var(--gold);
      color: #111;
      letter-spacing: 0.16em;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    button[disabled] { opacity: 0.45; cursor: default; }
    #status {
      min-height: 48px;
      margin: 22px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="card">
    <p class="kicker">PRINCIPAL DESK</p>
    <h1>Set Owner Role</h1>
    <p class="copy">Sign in with your real email first. Then press the button once. This marks the current account as owner.</p>
    <button type="button" id="set-owner">MARK THIS ACCOUNT AS OWNER</button>
    <p id="status"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    document.getElementById("set-owner").addEventListener("click", async function () {
      var status = document.getElementById("status");
      var button = document.getElementById("set-owner");
      var supabase = window.supabaseClient;
      status.textContent = "Working...";
      if (!supabase) {
        status.textContent = "Supabase is missing. Put this file in the same folder as supabase-config.js.";
        return;
      }
      button.disabled = true;
      var session = await supabase.auth.getSession();
      if (!session.data || !session.data.session) {
        status.textContent = "You are not signed in. Go to signin.html first, then open this page again.";
        button.disabled = false;
        return;
      }
      var update = await supabase.auth.updateUser({ data: { role: "owner" } });
      if (update.error) {
        status.textContent = "Error: " + update.error.message;
        button.disabled = false;
        return;
      }
      var userRes = await supabase.auth.getUser();
      var meta = (userRes.data && userRes.data.user && userRes.data.user.user_metadata) || {};
      status.textContent = "Done.\nEmail: " + (userRes.data.user.email || "") + "\nRole: " + (meta.role || "missing");
    });
  </script>
</body>
</html>
