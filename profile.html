<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member Profile | The We Method</title>
  <link rel="stylesheet" href="private-access.css">
  <link rel="stylesheet" href="pca-menu.css">
  <link rel="stylesheet" href="profile.css">
</head>
<body class="private-access-page profile-page">
  <header class="site-header">
    <a class="brand-mark" href="index.html">
      <span class="brand-monogram">TWM</span>
      <span class="brand-name">THE WE METHOD</span>
    </a>
    <span class="header-rule"></span>
    <div class="header-title">
      <span>MEMBER PROFILE</span>
      <small>PRIVATE CLIENT ACCESS</small>
    </div>
    <span class="header-rule"></span>
    <div class="member-profile">
      <span class="profile-icon"></span>
      <span class="profile-copy">
        <small>MEMBER PROFILE</small>
        <strong id="member-profile-name">Client</strong>
      </span>
    </div>
  </header>

  <main class="profile-main">
    <section class="profile-card">
      <p class="eyebrow">YOUR ACCOUNT</p>
      <h1>Member Profile</h1>
      <p class="profile-intro">Your private client details are held securely with your account.</p>

      <form id="profile-form">
        <label>FIRST NAME
          <input id="first-name" name="first-name" type="text">
        </label>
        <label>LAST NAME
          <input id="last-name" name="last-name" type="text">
        </label>
        <label>COMPANY
          <input id="company" name="company" type="text">
        </label>
        <label>EMAIL
          <input id="email" name="email" type="email" readonly>
        </label>
        <label>CITY
          <input id="city" name="city" type="text">
        </label>
        <label>STATE
          <input id="state" name="state" type="text">
        </label>
        <p id="profile-status"></p>
        <button type="submit">SAVE PROFILE</button>
      </form>

      <a href="private-access.html">← BACK TO PRIVATE ACCESS</a>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="pca-menu.js"></script>
  <script src="profile.js"></script>
</body>
</html>
