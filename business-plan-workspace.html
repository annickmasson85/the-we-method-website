<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Private workspace for the Business Plan.">
  <title>Business Plan | The We Method</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="private-access.css">
  <link rel="stylesheet" href="pca-menu.css">
  <link rel="stylesheet" href="business-plan-workspace.css">
</head>
<body class="private-access-page workspace-page">
  <header class="site-header">
    <a class="brand-mark" href="index.html" aria-label="The We Method home">
      <span class="brand-monogram">TWM</span>
      <span class="brand-name">THE WE METHOD</span>
    </a>
    <span class="header-rule" aria-hidden="true"></span>
    <div class="header-title">
      <span>YOUR COLLECTION</span>
      <small>BUILD <b>◆</b> LAUNCH <b>◆</b> GROW</small>
    </div>
    <span class="header-rule" aria-hidden="true"></span>
    <a class="member-profile" href="profile.html">
      <span class="profile-icon">
        <img id="header-photo" alt="" hidden>
        <svg id="header-icon" viewBox="0 0 48 48">
          <circle cx="24" cy="16.5" r="8"></circle>
          <path d="M8.5 40c1.8-9.1 7.4-14 15.5-14s13.7 4.9 15.5 14"></path>
        </svg>
      </span>
      <span class="profile-copy">
        <small>MEMBER PROFILE</small>
        <strong id="member-profile-name">Client</strong>
      </span>
    </a>
  </header>

  <main class="ws-shell">
    <aside class="ws-rail">
      <a class="ws-back" href="private-library.html">← RETURN TO COLLECTION</a>
      <p class="ws-kicker">BUILD COLLECTION</p>
      <h1>Business Plan</h1>
      <p class="ws-rail-copy">Organize the concept. Label every assumption. Decide before capital moves.</p>
      <nav class="ws-chapters" id="ws-chapters" aria-label="Sections"></nav>
    </aside>

    <article class="ws-stage" id="ws-stage"></article>

    <aside class="ws-progress">
      <p class="ws-kicker">PROGRESS</p>
      <strong id="ws-progress-count">1 / 12</strong>
      <p id="ws-progress-label">Section 01 open</p>
      <div class="ws-bar" aria-hidden="true"><span id="ws-bar-fill"></span></div>
      <p class="ws-progress-note">Complete the open section to unlock the next.</p>
    </aside>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="pca-menu.js"></script>
  <script src="business-plan-workspace.js"></script>
</body>
</html>
