<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Fleet Solution. Custom golf carts designed to reflect your business, your brand, and your vision.">
  <title>Fleet Solution | The We Method</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="private-access.css">
  <link rel="stylesheet" href="pca-menu.css">
  <link rel="stylesheet" href="private-fleet-solution.css">
</head>
<body class="private-access-page private-fleet-page">
  <header class="site-header">
    <span class="brand-mark">
      <span class="brand-monogram">TWM</span>
      <span class="brand-name">THE WE METHOD</span>
    </span>
    <span class="header-rule" aria-hidden="true"></span>
    <div class="header-title">
      <span>FLEET SOLUTION</span>
      <small>BUILD <b aria-hidden="true">◆</b> LAUNCH <b aria-hidden="true">◆</b> GROW</small>
    </div>
    <span class="header-rule" aria-hidden="true"></span>
    <a class="member-profile" href="profile.html" aria-label="Open member profile">
      <span class="profile-icon">
        <img id="header-photo" alt="Member profile" hidden>
        <svg id="header-icon" viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="24" cy="16.5" r="8"></circle>
          <path d="M8.5 40c1.8-9.1 7.4-14 15.5-14s13.7 4.9 15.5 14"></path>
        </svg>
      </span>
      <span class="profile-copy">
        <small>MEMBER PROFILE</small>
        <strong id="member-profile-name">Client</strong>
      </span>
      <span class="profile-chevron" aria-hidden="true"></span>
    </a>
  </header>

  <main class="private-fleet-main">
    <section class="private-fleet" aria-labelledby="private-fleet-title">
      <div class="private-fleet-copy">
        <p class="private-fleet-kicker">TWM</p>
        <span class="private-fleet-rule" aria-hidden="true"></span>
        <h1 id="private-fleet-title">
          <span>Fleet</span>
          <em>Solution</em>
        </h1>
        <span class="private-fleet-rule" aria-hidden="true"></span>
        <p>Custom golf carts designed to reflect<br>your business, your brand, and your vision.</p>
        <button class="private-fleet-remind" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3a5 5 0 0 0-5 5v2.2c0 .7-.3 1.4-.8 1.9L5 13.5V15h14v-1.5l-1.2-1.4a2.6 2.6 0 0 1-.8-1.9V8a5 5 0 0 0-5-5z"></path>
            <path d="M10 17a2 2 0 0 0 4 0"></path>
          </svg>
          <span>REMIND ME</span>
        </button>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="pca-menu.js"></script>
  <script src="private-fleet-solution.js"></script>
</body>
</html>
