<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080807">
<title>TWM | Application Desk</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="owner-applications.css">
<link rel="stylesheet" href="owner-menu.css">
<link rel="stylesheet" href="twm-application-desk.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="owner-menu.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#workspace-content">Skip to workspace</a>
  <button class="sidebar-scrim" id="sidebar-scrim" aria-label="Close navigation" hidden></button>
  <aside class="sidebar" id="sidebar" aria-label="Main navigation">
    <a class="brand" href="owner-applications.html" aria-label="The We Method">
      <span class="brand-twm">TWM</span>
      <small>THE WE METHOD</small>
    </a>
    <nav id="main-navigation">
      <div class="nav-group">
        <p class="nav-heading">Applications</p>
        <a class="nav-item" href="owner-applications.html">
          <svg class="icon"><use href="#i-home"/></svg>
          <span>Home</span>
        </a>
        <a class="nav-item is-active" href="twm-application-desk.html">
          <svg class="icon"><use href="#i-file"/></svg>
          <span>Applications</span>
        </a>
      </div>
    </nav>
  </aside>

  <div class="page-shell">
    <header class="site-header">
      <span class="brand-mark">
        <span class="brand-monogram">TWM</span>
        <span class="brand-name">THE WE METHOD</span>
      </span>
      <span class="header-rule"></span>
      <div class="header-title">
        <span>APPLICATION DESK</span>
        <small>REVIEW <b>◆</b> EVALUATE <b>◆</b> DECIDE</small>
      </div>
      <span class="header-rule"></span>
      <a class="member-profile" href="owner-profile.html">
        <span class="profile-icon">
          <img id="header-photo" alt="" hidden>
          <svg id="header-icon" viewBox="0 0 48 48"><circle cx="24" cy="16.5" r="8"></circle><path d="M8.5 40c1.8-9.1 7.4-14 15.5-14s13.7 4.9 15.5 14"></path></svg>
        </span>
        <span class="profile-copy">
          <small>OWNER PROFILE</small>
          <strong id="owner-name">Annick Masson</strong>
        </span>
      </a>
      <button class="icon-button menu-button" id="menu-button" type="button" aria-label="Open menu"><span></span><span></span><span></span></button>
    </header>

    <main class="shell">
      <div class="stats">
        <div class="stat"><strong id="pending-count">0</strong><span>Pending</span></div>
        <div class="stat"><strong id="accepted-count">0</strong><span>Accepted</span></div>
        <div class="stat"><strong id="declined-count">0</strong><span>Declined</span></div>
      </div>

      <div class="workspace">
        <aside class="panel">
          <h2 class="panel-title">Incoming applications <span class="badge" id="queue-count">0 to review</span></h2>
          <input type="search" id="search" placeholder="Search applications..." aria-label="Search applications">
          <nav class="controls" aria-label="Filter applications">
            <button class="filter active" data-filter="pending">Pending</button>
            <button class="filter" data-filter="accepted">Accepted</button>
            <button class="filter" data-filter="declined">Declined</button>
            <button class="filter" data-filter="all">All</button>
          </nav>
          <div class="application-list" id="application-list"></div>
        </aside>
        <section class="detail" id="detail" aria-live="polite"></section>
      </div>
    </main>
  </div>

  <script src="twm-application-desk.js"></script>
  <script>
    (async function () {
      var supabase = window.supabaseClient;
      if (!supabase) return;
      var session = await supabase.auth.getSession();
      if (!session.data || !session.data.session) return;
      var userRes = await supabase.auth.getUser();
      var user = (userRes.data && userRes.data.user) || session.data.session.user;
      var meta = (user && user.user_metadata) || {};
      var name = document.getElementById("owner-name");
      if (name) name.textContent = [meta.first_name, meta.last_name].filter(Boolean).join(" ") || "Annick Masson";
      if (meta.avatar_url) {
        var photo = document.getElementById("header-photo");
        var icon = document.getElementById("header-icon");
        if (photo) { photo.src = meta.avatar_url; photo.hidden = false; }
        if (icon) icon.style.display = "none";
      }
    })();
  </script>
</body>
</html>
