<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create New Password | The We Method</title>
  <link rel="stylesheet" href="forgot-password.css">
</head>

<body class="forgot-page">
  <main class="forgot-main">
    <section class="forgot-card">
      <div class="forgot-content">
        <p class="forgot-eyebrow">PRIVATE CLIENT ACCESS</p>
        <h1>CREATE A NEW PASSWORD</h1>
        <p class="forgot-description">
          Choose a new password for your private account.
        </p>

        <form id="reset-form">
          <label for="new-password">NEW PASSWORD</label>
          <input
            type="password"
            id="new-password"
            name="password"
            minlength="8"
            autocomplete="new-password"
            required
          >

          <label for="confirm-new-password" style="margin-top:16px">
            CONFIRM PASSWORD
          </label>
          <input
            type="password"
            id="confirm-new-password"
            name="confirmPassword"
            minlength="8"
            autocomplete="new-password"
            required
          >

          <p id="reset-status" class="forgot-status" role="status" aria-live="polite"></p>

          <button type="submit" id="save-password-button">
            SAVE NEW PASSWORD
          </button>
        </form>

        <a href="signin.html" class="back-signin">← BACK TO SIGN IN</a>
      </div>
    </section>
  </main>

  <footer class="forgot-footer">
    <div>
      <strong>TWM</strong>
      <span>• TESTED. PROVEN. BUILT TO LAST.</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="reset-password.js"></script>
</body>
