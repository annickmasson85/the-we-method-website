<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Client Sign In | The We Method</title>
  <link rel="stylesheet" href="signin.css">
  <style>
    .password-field { position: relative; }
    .password-field input { padding-right: 72px; }
    .password-toggle {
      position: absolute;
      top: 50%;
      right: 8px;
      z-index: 10;
      transform: translateY(-50%);
      pointer-events: auto;
    }
  </style>
</head>
<body class="signin-page">
  <main class="signin-main">
    <section class="signin-card">
      <header class="signin-heading">
        <p class="signin-eyebrow">WELCOME BACK</p>
        <h1>ENTER YOUR PRIVATE ACCESS</h1>
        <p class="signin-description">Sign in to continue to your Private Client Access.</p>
      </header>

      <form class="signin-form" id="signin-form">
        <div class="form-field">
          <label for="email">EMAIL ADDRESS</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-field">
          <label for="password">PASSWORD</label>
          <div class="password-field">
            <input type="password" id="password" name="password" required>
            <button type="button" class="password-toggle">SHOW</button>
          </div>
        </div>

        <div class="signin-options">
          <label class="remember-option">
            <input type="checkbox" id="remember-me" name="remember-me">
            <span>Remember me</span>
          </label>
          <a class="forgot-password" href="forgot-password.html">FORGOT YOUR PASSWORD?</a>
        </div>

        <p class="security-message">Secure private client access</p>
        <p id="signin-message" class="signin-message"></p>
        <button type="submit" class="signin-button">SIGN IN</button>
      </form>

      <div class="signin-bottom">
        <p>New to The We Method? <a href="signup.html">CREATE AN ACCOUNT</a></p>
        <a class="back-button" href="index.html">← BACK</a>
      </div>
    </section>
  </main>

  <footer class="site-footer impl-footer">
    <div class="impl-footer-inner">
      <div class="impl-footer-left">
        <strong>TWM</strong>
        <span>TESTED. PROVEN. BUILT TO LAST.</span>
      </div>
      <div class="impl-footer-social">
        <a href="https://www.instagram.com/thewemethod/" target="_blank" rel="noopener noreferrer">Instagram</a>
        <span>·</span>
        <a href="https://www.facebook.com/profile.php?id=61593652130304" target="_blank" rel="noopener noreferrer">Facebook</a>
      </div>
      <div class="impl-footer-right">
        <a href="mailto:info@thewemethod.com">info@thewemethod.com</a>
        <span>© 2026 The We Method</span>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="signin.js"></script>
</body>
</html>
